name: Update AI Surge Rules

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate rules
        run: python3 scripts/generate_ai_surge_rules.py

      - name: Commit changes
        run: |
          if git diff --quiet -- AI.list; then
            echo "AI.list is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI.list
          git commit -m "Update AI Surge rules"
          git push
