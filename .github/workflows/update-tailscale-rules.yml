name: Update Tailscale Surge Rules

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate rules
        run: python3 scripts/generate_tailscale_surge_rules.py

      - name: Commit changes
        run: |
          if git diff --quiet -- tailscale.list; then
            echo "tailscale.list is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailscale.list
          git commit -m "Update Tailscale Surge rules"
          git push
