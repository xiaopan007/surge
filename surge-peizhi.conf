[Proxy]
直连 = direct

[Proxy Group]
Global = select, update-interval=43200, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=VPS
Google = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Global
AI = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Global
Paypal = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Global
Apple = select, 直连, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Global
Microsoft = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Apple
WeChat = select, 直连, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Apple
Telegram = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Global
Mail = select, update-interval=43200, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Apple
VPS = select, update-interval=43200, no-alert=0, hidden=1, include-all-proxies=0

[Rule]
